name: CI

# Damir 13.11.2026: lint, unit tests and e2e run locally before every push,
# so GitHub doesn't run them on its own. Start it by hand when you want it.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each environment validates the contract from the same API branch.
      - name: Fetch the API contract
        run: curl -fsSL "https://raw.githubusercontent.com/BreraDMR/xtrix-api/${{ github.base_ref || github.ref_name }}/openapi.json" -o "$RUNNER_TEMP/openapi.json"
      - name: scripts/check.sh
        env:
          OPENAPI_JSON: ${{ runner.temp }}/openapi.json
        run: ./scripts/check.sh
