name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the contract lives in xtrix-api; the web client on develop follows the API's develop
      - name: Fetch the API contract
        run: curl -fsSL "https://raw.githubusercontent.com/BreraDMR/xtrix-api/${{ github.base_ref || github.ref_name }}/openapi.json" -o "$RUNNER_TEMP/openapi.json"
      - name: scripts/check.sh
        env:
          OPENAPI_JSON: ${{ runner.temp }}/openapi.json
        run: ./scripts/check.sh
